name: "PMD"
description: "Read PMD and add annotations"
inputs:
  src:
    required: false
    default: ""
    description: "Prefix for the file paths in the PMD report. Leave it empty if the paths start at the repository root (`src/org/...`), set it to `src` if they start inside it (`org/...`)."
  file:
    required: true
    description: The PMD file to parse and upload
  severity:
    required: false
    default: "error"
    description: "`error` fails the step when PMD finds something, `warning` only reports it."

runs:
  using: "node24"
  main: "dist/index.js"
